# mise.toml — fonte única das versões de runtime e CLIs do projeto (versionado).
# Windows: winget install jdx.mise; os atalhos (%LOCALAPPDATA%\mise\shims) precisam estar no PATH.
min_version = "2026.9.0"

[tools]
node = "24"          # hooks em .claude/hooks/*.mjs, em qualquer stack
just = "1.58"        # executor de tarefas (justfile)
"npm:@colbymchenry/codegraph" = "1.6.2"    # CodeGraph: ferramenta de IA da comunidade; o workflow semanal sobe a versão por PR
uv = "0.12"          # o backend pipx do mise instala o specify por ele, também no JS/TS
"pipx:specify-cli" = "1.2.3"    # Spec Kit: ferramenta de IA da comunidade; o workflow semanal sobe a versão por PR
gitleaks = "8.30"    # segredo no commit, no just check, no bundle do web e na CI
lefthook = "2.2"     # hooks do git: o gitleaks antes do commit e a mensagem em Conventional Commits
"pipx:semgrep" = "1.182.1"   # just security: as regras OWASP do semgrep, só aviso (licença das regras: uso interno)
pnpm = "11"
"npm:typescript-language-server" = "6.0.1"   # language server do plugin typescript-lsp

[settings]
lockfile = true      # mantém mise.lock atualizado
