# The installer (research R2; ADR 0003): one per-user NSIS install at a fixed path
# (%LOCALAPPDATA%\Programs\idleon-companion\), so the Steam launch option stays valid across versions.
# No game file and no code signing (FR-002, spec Assumptions). `just package` builds it; `just release` publishes it.
appId: com.arkh.idleon-companion
productName: IdleOn Companion
executableName: IdleOn Companion
directories:
  output: dist
files:
  - out/**
  - package.json
# A worker cannot start from inside an asar: only the calculator goes next to it, in app.asar.unpacked.
asarUnpack:
  - out/main/calculator.js
# The keeper loads read.js on every cycle, and the two state scripts once, from resources\ next to app.asar.
extraResources:
  - from: src/keeper/read.js
    to: read.js
  - from: src/keeper/state-list.js
    to: state-list.js
  - from: src/keeper/state-slice.js
    to: state-slice.js
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: true
  include: build/installer.nsh
publish:
  provider: github
  owner: Arkh-Company
  repo: idleon-companion-releases
