schema_version: "1.0"
preset:
  id: "kit-base"
  name: "Kit base"
  version: "0.1.0"
  description: "Kit base additions to the Spec Kit: text added to the core templates and commands, never a replacement."
requires:
  speckit_version: ">=1.0.13"
provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Out of Scope section and Open Questions table at the end of every spec"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-addendum.md"
      description: "Mandatory tests, Independent Test and Verify line per phase, and the Review Focus section at the end of every tasks.md"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify-wrap.md"
      description: "Brainstorming hand-off, ASCII short name and no update-by-specify before; progress.yml, commit and clarify after"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/clarify-append.md"
      description: "Open Questions table, security and ux checklists, progress.yml, commit and the next move after each round"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/plan-wrap.md"
      description: "Refuses to start with open questions, reads the prototype and past decisions before; ADRs, progress.yml and commit after"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks-append.md"
      description: "Applies the tasks template rules; progress.yml, commit and the spec PR after"
      strategy: "append"
